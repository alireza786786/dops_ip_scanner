name: CI (tests)

on:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'manifest.json', '*.py', 'tests/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test tools
        run: |
          pip install playwright==1.63.0 PyYAML==6.0.3 opencv-python-headless==4.10.0.84 numpy
          python -m playwright install --with-deps chromium

      - name: Scan engine (local TLS servers)
        run: python tests/test_engine.py

      - name: DNSTT resolver tester
        run: python tests/test_dnstt.py

      - name: Scan workflow (shell steps against a local git remote)
        run: python tests/test_workflow.py

      - name: Web scanner (Chromium)
        run: python tests/test_web.py

      - name: PWA (service worker, offline)
        run: python tests/test_pwa.py

      - name: UI (header icons, splash screen, unofficial-copy warning)
        run: python tests/test_ui.py

      - name: Features (quick mode, QR modal, freshness badge, privacy, wipe, CSP)
        run: python tests/test_features.py

      - name: QR encoder (decoded with OpenCV)
        run: python tests/test_qr.py

      - name: V15 features (feedback, trend, community, IPv6, experimental labels)
        run: python tests/test_v15.py

      - name: Accessibility (contrast, names, touch targets, dialogs)
        run: python tests/test_a11y.py

      - name: Real config test tool (fake Xray; no network needed)
        run: python tests/test_config_test.py

      - name: Cloudflare Worker (cron trigger + community results)
        run: node tests/test_worker.mjs

