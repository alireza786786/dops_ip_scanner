name: Auto CDN Scanner & Telegram Sender

on:
  schedule:
    - cron: '7,22,37,52 * * * *'  # هر ۱۵ دقیقه یک «نوبت»؛ اسکن واقعی حداکثر هر ۲۵ دقیقه (بقیه رد می‌شوند). اگر گیت‌هاب نوبتی را حذف کرد، نوبت بعدی جبران می‌کند
  workflow_dispatch:
    inputs:
      force_telegram:
        description: 'ارسال اجباری به تلگرام (بدون توجه به فاصلهٔ ۳ ساعته)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cdn-scanner            # دو اجرای هم‌زمان روی هم نمی‌افتند
  cancel-in-progress: false

env:
  SCAN_MIN_GAP_MIN: ${{ github.event_name == 'schedule' && '25' || '0' }}   # اجرای دستی همیشه اسکن می‌کند
  TG_INTERVAL_MIN: '170'        # فاصلهٔ ارسال تلگرام (دقیقه)؛ ۱۷۰ تا با تأخیر زمان‌بندی گیت‌هاب ≈ هر ۳ ساعت بماند

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run info
        run: echo "event=${{ github.event_name }} cron='${{ github.event.schedule }}' at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore previous outputs from data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs
          if git fetch --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data 2>/dev/null; then
            git checkout FETCH_HEAD -- outputs || echo "data branch has no outputs yet"
          else
            echo "no data branch yet (first run)"
          fi
          (cd outputs && find . -type f | sort | xargs -r sha256sum | sha256sum) > /tmp/outputs.before

      - name: Run Cloudflare Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          TG_FORCE: ${{ github.event.inputs.force_telegram == 'true' && '1' || '' }}
        run: python3 start.py

      - name: Run Fastly Scanner
        if: ${{ !cancelled() }}   # حتی اگر اسکن کلودفلر شکست خورد، Fastly اجرا شود
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          TG_FORCE: ${{ github.event.inputs.force_telegram == 'true' && '1' || '' }}
        run: python3 fastly.py

      - name: Publish outputs to data branch
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          after=$( (cd outputs && find . -type f | sort | xargs -r sha256sum | sha256sum) )
          if [ "$after" = "$(cat /tmp/outputs.before)" ]; then echo "No changes"; exit 0; fi
          rm -rf /tmp/pub && mkdir /tmp/pub && cp -r outputs /tmp/pub/outputs
          cd /tmp/pub
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data && exit 0
            sleep 5
          done
          echo "push failed after 3 attempts"; exit 1
